[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stock_monitor"
version = "4.8.4"
description = "A real-time stock monitoring application for A-shares"
authors = [
    {name = "Stock Monitor Team"}
]
requires-python = ">=3.9"
dependencies = [
    "PyQt6>=6.0.0",
    "easyquotation>=0.7.7",
    "pypinyin>=0.44.0",
    "pywin32>=304",
    "packaging>=21.3",
    "requests>=2.28.1",
    "pandas>=2.0.0",
    "numpy>=1.20.0",
    "zhconv>=1.4.1",
    "openpyxl>=3.0.7",
    "pandas-ta-classic>=0.3.14",
    "akshare>=1.15.58",
    "tenacity>=8.0.0",
    "lxml>=4.9.0",
    "beautifulsoup4>=4.11.0",
    "html5lib>=1.1",
    "pytz>=2024.1",
    "urllib3>=2.0.6",
    "certifi>=2024.0.0",
    "matplotlib>=3.7.0",
    "mplfinance>=0.12.10b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2.0",
    "pytest-cov>=4.0.0",
    "pytest-qt>=4.2.0",
    "black>=23.3.0",
    "ruff>=0.0.267",
    "pre-commit>=3.3.1",
]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "W",  # pycodestyle warnings
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = ["E501", "C901", "E402", "B007"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.pytest.ini_options]
qt_api = "pyqt6"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not gui and not integration'"
markers = [
    "gui: 需要交互桌面会话（会构造真实原生窗口/嵌入任务栏），默认排除；用 -m gui 单独运行",
    "integration: 依赖真实外部服务的集成测试，默认排除；用 -m integration 单独运行",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
